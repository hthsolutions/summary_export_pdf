name: Weekly summary

on:
  # The send pdf Zap dispatches this workflow. Run workflow in the
  # Actions tab starts the same job.
  workflow_dispatch:

jobs:
  export:
    runs-on: windows-latest
    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4

      - name: Checkout revel-demo
        uses: actions/checkout@v4
        with:
          repository: hthsolutions/revel-demo
          ref: main
          path: revel-demo

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Export the current week
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          REVEL_DEMO: ${{ github.workspace }}/revel-demo
        run: python export_weekly_summary.py

      - name: Upload Excel and PDF
        uses: actions/upload-artifact@v4
        with:
          name: weekly-summary
          path: |
            Weekly_Summary_*.xlsx
            Weekly_Summary_*.pdf
          if-no-files-found: error
          retention-days: 90

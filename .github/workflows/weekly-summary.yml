name: Weekly summary

on:
  # The send pdf Zap dispatches this workflow. Run workflow in the
  # Actions tab starts the same job.
  workflow_dispatch:

jobs:
  export:
    runs-on: windows-latest
    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4

      - name: Checkout revel-demo
        uses: actions/checkout@v4
        with:
          repository: hthsolutions/revel-demo
          ref: main
          path: revel-demo

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Export the current week
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          REVEL_DEMO: ${{ github.workspace }}/revel-demo
        run: python export_weekly_summary.py

      - name: Find the PDF
        id: pdf
        shell: pwsh
        run: |
          $pdf = Get-ChildItem -Path . -Filter "Weekly_Summary_*.pdf" | Select-Object -First 1
          if (-not $pdf) { throw "No PDF was written." }
          "path=$($pdf.Name)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8NoBOM

      - name: Check mail settings
        id: mail
        shell: pwsh
        env:
          MAIL_TO: ${{ secrets.MAIL_TO }}
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
        run: |
          $ready = -not [string]::IsNullOrWhiteSpace($env:MAIL_TO) `
            -and -not [string]::IsNullOrWhiteSpace($env:MAIL_USERNAME) `
            -and -not [string]::IsNullOrWhiteSpace($env:MAIL_PASSWORD)
          "send=$($ready.ToString().ToLower())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8NoBOM

      - name: Email the PDF
        if: steps.mail.outputs.send == 'true'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: Summary (Weekly)
          to: ${{ secrets.MAIL_TO }}
          from: Weekly Summary <${{ secrets.MAIL_USERNAME }}>
          body: The weekly summary PDF is attached.
          attachments: ${{ steps.pdf.outputs.path }}

      - name: Upload PDF
        uses: actions/upload-artifact@v4
        with:
          name: weekly-summary
          path: Weekly_Summary_*.pdf
          if-no-files-found: error
          retention-days: 90
